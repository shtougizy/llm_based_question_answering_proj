<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"SimSun","Times New Roman",serif;background:#fff;padding:30px;text-align:center}</style>
</head>
<body>
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#111"/></marker>
  </defs>

  <rect x="130" y="0" width="140" height="32" rx="16" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="200" y="21" text-anchor="middle" font-size="14" font-weight="bold" fill="#111" font-family="'Times New Roman',SimSun,serif">开始</text>
  <line x1="200" y1="32" x2="200" y2="52" stroke="#111" stroke-width="2" marker-end="url(#a)"/>

  <rect x="100" y="54" width="200" height="38" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="200" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#111" font-family="'Times New Roman',SimSun,serif">倾斜校正</text>
  <line x1="200" y1="92" x2="200" y2="114" stroke="#111" stroke-width="2" marker-end="url(#a)"/>

  <rect x="100" y="116" width="200" height="38" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="200" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#111" font-family="'Times New Roman',SimSun,serif">透视校正</text>
  <line x1="200" y1="154" x2="200" y2="176" stroke="#111" stroke-width="2" marker-end="url(#a)"/>

  <rect x="100" y="178" width="200" height="38" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="200" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#111" font-family="'Times New Roman',SimSun,serif">CLAHE 增强</text>
  <line x1="200" y1="216" x2="200" y2="238" stroke="#111" stroke-width="2" marker-end="url(#a)"/>

  <rect x="100" y="240" width="200" height="38" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="200" y="264" text-anchor="middle" font-size="14" font-weight="bold" fill="#111" font-family="'Times New Roman',SimSun,serif">非局部去噪</text>
  <line x1="200" y1="278" x2="200" y2="300" stroke="#111" stroke-width="2" marker-end="url(#a)"/>

  <rect x="130" y="302" width="140" height="32" rx="16" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="200" y="323" text-anchor="middle" font-size="14" font-weight="bold" fill="#111" font-family="'Times New Roman',SimSun,serif">结束</text>
</svg>
</body>
</html>
