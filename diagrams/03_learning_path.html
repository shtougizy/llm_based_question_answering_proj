<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"SimSun","Times New Roman",serif;background:#fff;padding:36px;text-align:center}</style>
</head>
<body>
<svg width="640" height="520" viewBox="0 0 640 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#111"/></marker>
  </defs>

  <!-- Title: Weak Point -->
  <rect x="180" y="10" width="280" height="32" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="320" y="31" text-anchor="middle" font-size="14" font-weight="bold" fill="#111" font-family="'Times New Roman',SimSun,serif">薄弱知识点：质量守恒定律的应用</text>

  <!-- Arrow -->
  <line x1="320" y1="42" x2="320" y2="66" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
  <text x="328" y="58" text-anchor="start" font-size="12" fill="#111" font-family="'Times New Roman',SimSun,serif">BFS 前置依赖展开（深度=2）</text>

  <!-- BFS Subgraph -->
  <rect x="60" y="72" width="520" height="94" rx="8" fill="#fff" stroke="#111" stroke-width="2"/>

  <!-- Row 1 -->
  <rect x="100" y="90" width="130" height="26" rx="4" fill="#fff" stroke="#111" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="165" y="108" text-anchor="middle" font-size="12" fill="#111" font-family="'Times New Roman',SimSun,serif">化学变化与物理变化</text>

  <line x1="240" y1="103" x2="266" y2="103" stroke="#111" stroke-width="2" marker-end="url(#a)"/>

  <rect x="270" y="90" width="110" height="26" rx="4" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="325" y="108" text-anchor="middle" font-size="12" fill="#111" font-family="'Times New Roman',SimSun,serif">质量守恒定律</text>

  <line x1="390" y1="103" x2="416" y2="103" stroke="#111" stroke-width="2" marker-end="url(#a)"/>

  <rect x="420" y="90" width="140" height="26" rx="4" fill="#fff" stroke="#111" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="490" y="108" text-anchor="middle" font-size="12" fill="#111" font-family="'Times New Roman',SimSun,serif">质量守恒定律的应用</text>

  <!-- Row 2 -->
  <rect x="100" y="128" width="130" height="26" rx="4" fill="#fff" stroke="#111" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="165" y="146" text-anchor="middle" font-size="12" fill="#111" font-family="'Times New Roman',SimSun,serif">化学方程式配平</text>

  <line x1="240" y1="141" x2="266" y2="141" stroke="#111" stroke-width="2" marker-end="url(#a)"/>

  <rect x="270" y="128" width="110" height="26" rx="4" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="325" y="146" text-anchor="middle" font-size="12" fill="#111" font-family="'Times New Roman',SimSun,serif">质量守恒定律</text>

  <!-- Arrow down -->
  <line x1="320" y1="166" x2="320" y2="196" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
  <text x="328" y="186" text-anchor="start" font-size="12" fill="#111" font-family="'Times New Roman',SimSun,serif">Kahn 拓扑排序 → 三阶段划分</text>

  <!-- Three-Stage Learning Path Box -->
  <rect x="80" y="204" width="480" height="210" rx="8" fill="#fff" stroke="#111" stroke-width="2"/>

  <!-- Stage 1 -->
  <rect x="120" y="224" width="100" height="32" rx="6" fill="#111"/>
  <text x="170" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff" font-family="'Times New Roman',SimSun,serif">基础巩固</text>
  <text x="240" y="245" font-size="14" fill="#111" font-family="'Times New Roman',SimSun,serif">化学变化与物理变化 · 化学方程式配平</text>

  <!-- Arrow -->
  <line x1="320" y1="258" x2="320" y2="280" stroke="#111" stroke-width="2" marker-end="url(#a)"/>

  <!-- Stage 2 -->
  <rect x="120" y="284" width="100" height="32" rx="6" fill="#111"/>
  <text x="170" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff" font-family="'Times New Roman',SimSun,serif">过渡提升</text>
  <text x="240" y="305" font-size="14" fill="#111" font-family="'Times New Roman',SimSun,serif">质量守恒定律</text>

  <!-- Arrow -->
  <line x1="320" y1="318" x2="320" y2="340" stroke="#111" stroke-width="2" marker-end="url(#a)"/>

  <!-- Stage 3 -->
  <rect x="120" y="344" width="100" height="32" rx="6" fill="#111"/>
  <text x="170" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff" font-family="'Times New Roman',SimSun,serif">核心突破</text>
  <text x="240" y="365" font-size="14" fill="#111" font-family="'Times New Roman',SimSun,serif">质量守恒定律的应用</text>

  <!-- Bottom note -->
  <text x="320" y="400" text-anchor="middle" font-size="12" fill="#111" font-family="'Times New Roman',SimSun,serif">每个阶段通过题库匹配获取对应练习题，按难度从低到高排列</text>

</svg>
</body>
</html>
