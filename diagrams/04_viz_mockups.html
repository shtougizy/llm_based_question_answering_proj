<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Times New Roman","SimSun",serif;background:#fff;padding:40px}
h2{text-align:center;font-size:22px;color:#111;margin-bottom:20px;font-weight:bold}
.grid{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;max-width:750px;margin:0 auto}
.card{width:210px;border:3px solid #111;border-radius:10px;overflow:hidden;background:#fff}
.card-header{background:#fff;color:#111;font-size:13px;;padding:8px 12px;text-align:center;border-bottom:2px solid #111}
.card-body{padding:14px;height:110px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.dp-table{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:#111;padding:2px;border-radius:4px}
.dp-cell{background:#fff;font-size:10px;text-align:center;padding:4px 6px;color:#111;}
.dp-hl{background:#fff;color:#111;border:2px solid #111}
.bars{display:flex;align-items:flex-end;gap:6px;height:70px}
.bar{width:22px;background:#111;border-radius:3px 3px 0 0}
.bar-hl{width:22px;border-radius:3px 3px 0 0;background:repeating-linear-gradient(45deg,#111,#111 2px,#fff 2px,#fff 4px);border:2px solid #111}
.tree{display:flex;flex-direction:column;align-items:center;font-size:10px;color:#111;line-height:2}
.tree-root{border:2px solid #111;border-radius:5px;padding:2px 10px;;color:#111;background:#fff}
.tree-branch{display:flex;gap:20px;margin-top:4px}
.tree-edge{font-size:12px;color:#111}
.tree-node{border:2px solid #111;border-radius:4px;padding:2px 8px;background:#fff}
.bs-box{display:inline-block;width:24px;height:20px;border:2px solid #111;border-radius:3px;text-align:center;font-size:10px;line-height:20px;;margin:2px}
.bs-hl{background:#fff;color:#111;border:3px solid #111}
.step-list{width:100%}
.step-item{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;margin:2px 0;border-radius:4px;font-size:11px;color:#111}
.step-active{background:#fff;color:#111;;border:2px solid #111}
.step-inactive{background:#fff;color:#111}
.caption{text-align:center;font-size:14px;color:#111;margin-top:20px;}
</style>
</head>
<body>
<h2>图4-4  五类程序题可视化模板效果示意图</h2>
<div class="grid">
  <div class="card">
    <div class="card-header">(1) 01背包 DP 表格动画</div>
    <div class="card-body">
      <div class="dp-table">
        <div class="dp-cell">-</div><div class="dp-cell">0</div><div class="dp-cell">1</div><div class="dp-cell">2</div>
        <div class="dp-cell">A</div><div class="dp-cell">0</div><div class="dp-hl">3</div><div class="dp-cell">3</div>
        <div class="dp-cell">B</div><div class="dp-cell">0</div><div class="dp-cell">3</div><div class="dp-cell">5</div>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-header">(2) 排序算法柱状图动画</div>
    <div class="card-body">
      <div class="bars">
        <div class="bar" style="height:32px"></div>
        <div class="bar-hl" style="height:48px"></div>
        <div class="bar" style="height:22px"></div>
        <div class="bar" style="height:58px"></div>
        <div class="bar-hl" style="height:40px"></div>
        <div class="bar" style="height:52px"></div>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-header">(3) 斐波那契递归树</div>
    <div class="card-body">
      <div class="tree">
        <div class="tree-root">fib(4)</div>
        <div class="tree-edge">↙ &nbsp; &nbsp; &nbsp; ↘</div>
        <div class="tree-branch">
          <div class="tree-node">fib(3)</div>
          <div class="tree-node" style="background:#fff">fib(2)</div>
        </div>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-header">(4) 二分查找区间演示</div>
    <div class="card-body">
      <div style="margin-bottom:6px">
        <span class="bs-box bs-hl">1</span>
        <span class="bs-box">3</span>
        <span class="bs-box bs-hl">5</span>
        <span class="bs-box">7</span>
        <span class="bs-box">9</span>
      </div>
      <div style="font-size:10px;color:#111;line-height:1.6">
        L=0 &nbsp; mid=2 &nbsp; R=4<br>
        <span style="color:#111;">target=5, found ✓</span>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-header">(5) 解题步骤逐步展示</div>
    <div class="card-body">
      <div class="step-list">
        <div class="step-item step-active"><span>Step 1</span><span>▶ 分析题意</span></div>
        <div class="step-item step-inactive"><span>Step 2</span><span>建立模型</span></div>
        <div class="step-item step-inactive"><span>Step 3</span><span>推导计算</span></div>
        <div class="step-item step-inactive"><span>Step 4</span><span>验证结果</span></div>
      </div>
    </div>
  </div>
</div>
<div class="caption">图4-4  五类程序题可视化模板效果示意图</div>
</body>
</html>
