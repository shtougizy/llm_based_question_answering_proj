<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拍照搜题辅助学习系统</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f0f4f8; min-height: 100vh; }
.navbar {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  padding: 14px 24px; display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 2px 12px rgba(102,126,234,0.4);
}
.navbar h1 { color: #fff; font-size: 1.2rem; font-weight: 600; }
.nav-links a { color: rgba(255,255,255,0.85); text-decoration: none; margin-left: 20px; font-size: 0.9rem; transition: color 0.2s; }
.nav-links a:hover { color: #fff; }
.container { max-width: 800px; margin: 32px auto; padding: 0 16px; }
.card { background: #fff; border-radius: 16px; padding: 28px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); margin-bottom: 20px; }
.card-title { font-size: 1rem; font-weight: 600; color: #374151; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
.card-title::before { content: ''; width: 4px; height: 18px; background: #667eea; border-radius: 2px; }
.upload-area { border: 2px dashed #c4b5fd; border-radius: 12px; padding: 40px 20px; text-align: center; cursor: pointer; transition: all 0.2s; background: #faf5ff; }
.upload-area:hover, .upload-area.dragover { border-color: #7c3aed; background: #f3e8ff; }
.upload-icon { font-size: 3rem; margin-bottom: 12px; }
.upload-text { color: #6b7280; font-size: 0.9rem; }
.upload-hint { color: #a78bfa; font-size: 0.8rem; margin-top: 6px; }
#preview-img { max-width: 100%; max-height: 300px; border-radius: 8px; margin-top: 12px; display: none; }
.or-divider { text-align: center; color: #9ca3af; font-size: 0.85rem; margin: 16px 0; position: relative; }
.or-divider::before, .or-divider::after { content: ''; position: absolute; top: 50%; width: 42%; height: 1px; background: #e5e7eb; }
.or-divider::before { left: 0; } .or-divider::after { right: 0; }
textarea { width: 100%; border: 1.5px solid #e5e7eb; border-radius: 10px; padding: 12px; font-size: 0.9rem; resize: vertical; min-height: 80px; font-family: inherit; transition: border-color 0.2s; outline: none; }
textarea:focus { border-color: #667eea; }
.options-row { display: flex; align-items: center; gap: 16px; margin-top: 14px; flex-wrap: wrap; }
.checkbox-label { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #6b7280; cursor: pointer; }
.btn { padding: 12px 32px; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; box-shadow: 0 4px 12px rgba(102,126,234,0.35); }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(102,126,234,0.45); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
.btn-outline { background: transparent; color: #667eea; border: 1.5px solid #667eea; }
.btn-outline:hover { background: #f3f4ff; }
.btn-danger { background: #fef2f2; color: #dc2626; border: 1.5px solid #fca5a5; }
.btn-danger:hover { background: #fee2e2; }
#result-section { display: none; }
.result-meta { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.tag { padding: 4px 12px; border-radius: 20px; font-size: 0.78rem; font-weight: 500; }
.tag-purple { background: #f3e8ff; color: #7c3aed; } .tag-green { background: #d1fae5; color: #059669; }
.tag-blue { background: #dbeafe; color: #1d4ed8; } .tag-orange { background: #ffedd5; color: #c2410c; }
.question-box { background: #f8fafc; border-left: 4px solid #667eea; border-radius: 4px; padding: 14px 16px; margin-bottom: 16px; font-size: 0.9rem; line-height: 1.7; color: #374151; }
.answer-box { background: #f0fdf4; border: 1.5px solid #86efac; border-radius: 10px; padding: 16px; font-size: 0.9rem; line-height: 1.8; color: #166534; white-space: pre-wrap; }
.matched-box { background: #eff6ff; border: 1.5px solid #93c5fd; border-radius: 10px; padding: 14px; font-size: 0.85rem; color: #1e40af; }
.matched-box .label { font-weight: 600; margin-bottom: 6px; }
.viz-container { margin-top: 16px; }
.viz-container iframe { width: 100%; height: 400px; border: 1.5px solid #e5e7eb; border-radius: 10px; }
.knowledge-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.knowledge-tag { padding: 3px 10px; background: #f3f4f6; color: #6b7280; border-radius: 12px; font-size: 0.78rem; }
.loading { display: none; text-align: center; padding: 40px; }
.spinner { width: 40px; height: 40px; border: 4px solid #e5e7eb; border-top-color: #667eea; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { color: #6b7280; font-size: 0.9rem; }
.action-bar { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.alert { padding: 12px 16px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 16px; }
.alert-error { background: #fef2f2; color: #dc2626; border: 1px solid #fca5a5; }

/* 思考过程折叠 */
.thinking-wrap { margin-bottom: 14px; border-radius: 10px; overflow: hidden; border: 1px solid #fde68a; }
.thinking-header {
  display: flex; align-items: center; gap: 8px; padding: 10px 14px;
  background: #fefce8; cursor: pointer; user-select: none;
  font-size: 0.82rem; color: #92400e; font-weight: 500;
}
.thinking-header:hover { background: #fef9c3; }
.thinking-arrow { margin-left: auto; font-size: 0.75rem; transition: transform 0.2s; }
.thinking-arrow.open { transform: rotate(180deg); }
.thinking-body {
  display: none; background: #fffbeb; padding: 12px 14px;
  font-size: 0.8rem; color: #78350f; line-height: 1.75;
  white-space: pre-wrap; max-height: 280px; overflow-y: auto;
  border-top: 1px solid #fde68a;
}
.thinking-body.show { display: block; }

.nav-user{display:flex;align-items:center;gap:8px;margin-left:16px;}
.nav-btn{padding:6px 16px;border-radius:8px;font-size:0.82rem;font-weight:600;cursor:pointer;transition:all 0.2s;border:none;}
.nav-btn-outline{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,0.6);}
.nav-btn-outline:hover{background:rgba(255,255,255,0.15);}
.nav-btn-primary{background:#fff;color:#667eea;}
.nav-btn-primary:hover{background:#f3f4f6;}
.nav-username{color:#fff;font-size:0.85rem;font-weight:500;}
.nav-logout{color:rgba(255,255,255,0.7);font-size:0.82rem;cursor:pointer;background:none;border:none;padding:0;}
.nav-logout:hover{color:#fff;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.2s;}
.modal-overlay.show{opacity:1;pointer-events:all;}
.modal-box{background:#fff;border-radius:20px;padding:36px;width:100%;max-width:400px;margin:16px;box-shadow:0 20px 60px rgba(0,0,0,0.2);transform:translateY(20px);transition:transform 0.2s;position:relative;}
.modal-overlay.show .modal-box{transform:translateY(0);}
.modal-close{position:absolute;top:14px;right:18px;background:none;border:none;font-size:1.4rem;color:#9ca3af;cursor:pointer;line-height:1;}
.modal-close:hover{color:#374151;}
.modal-tabs{display:flex;background:#f3f4f6;border-radius:10px;padding:3px;margin-bottom:24px;}
.modal-tab{flex:1;padding:8px;border:none;background:transparent;border-radius:8px;font-size:0.88rem;font-weight:600;cursor:pointer;color:#6b7280;transition:all 0.2s;}
.modal-tab.active{background:#fff;color:#374151;box-shadow:0 1px 4px rgba(0,0,0,0.1);}
.modal-form{display:none;}
.modal-form.active{display:block;}
.mf-group{margin-bottom:14px;}
.mf-group label{font-size:0.8rem;color:#6b7280;font-weight:500;display:block;margin-bottom:5px;}
.mf-group input{width:100%;border:1.5px solid #e5e7eb;border-radius:9px;padding:10px 13px;font-size:0.88rem;outline:none;transition:border-color 0.2s;}
.mf-group input:focus{border-color:#667eea;}
.phone-row{display:flex;gap:8px;}
.phone-row input{flex:1;}
.sms-btn{padding:10px 12px;border:1.5px solid #667eea;border-radius:9px;background:transparent;color:#667eea;font-size:0.78rem;font-weight:600;cursor:pointer;white-space:nowrap;}
.sms-btn:disabled{opacity:0.5;cursor:not-allowed;}
.mf-submit{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:0.92rem;font-weight:600;cursor:pointer;margin-top:4px;}
.mf-submit:disabled{opacity:0.6;cursor:not-allowed;}
.mf-guest{width:100%;padding:10px;border:1.5px solid #e5e7eb;border-radius:10px;background:#f9fafb;color:#6b7280;font-size:0.85rem;font-weight:500;cursor:pointer;margin-top:8px;}
.mf-alert{padding:8px 12px;border-radius:8px;font-size:0.8rem;margin-bottom:12px;display:none;}
.mf-alert-err{background:#fef2f2;color:#dc2626;border:1px solid #fca5a5;}
.mf-alert-ok{background:#f0fdf4;color:#059669;border:1px solid #86efac;}
</style>
</head>
<body>

<nav class="navbar">
  <h1>📚 拍照搜题辅助学习系统</h1>
  <div class="nav-links">
    <a href="/">首页</a>
    <a href="/history">历史记录</a>
    <a href="/wrong-book">错题本</a>
    <div class="nav-user" id="nav-user">
      <button class="nav-btn nav-btn-outline" onclick="showModal('login')">登录</button>
      <button class="nav-btn nav-btn-primary" onclick="showModal('register')">注册</button>
    </div>
  </div>
</nav>

<div class="container">
  <!-- 输入卡片 -->
  <div class="card">
    <div class="card-title">提交题目</div>
    <div class="upload-area" id="upload-area" onclick="document.getElementById('file-input').click()">
      <div class="upload-icon">📷</div>
      <div class="upload-text">点击或拖拽上传题目图片</div>
      <div class="upload-hint">支持 JPG / PNG / HEIC 等格式</div>
      <img id="preview-img" alt="预览">
    </div>
    <input type="file" id="file-input" accept="image/*" style="display:none">
    <div class="or-divider">或者手动输入题目</div>
    <textarea id="text-input" placeholder="请在此输入题目内容..."></textarea>
    <div class="options-row">
      <label class="checkbox-label">
        <input type="checkbox" id="need-viz"> 生成程序题可视化
      </label>
      <div style="flex:1"></div>
      <button class="btn btn-primary" id="submit-btn" onclick="submitQuestion()">🔍 搜题解答</button>
    </div>
  </div>

  <!-- Loading -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-text">正在识别题目...</div>
  </div>

  <!-- 错误提示 -->
  <div class="alert alert-error" id="error-alert" style="display:none"></div>

  <!-- 结果卡片 -->
  <div id="result-section">
    <div class="card">
      <div class="card-title">解题结果</div>
      <div class="result-meta" id="result-meta"></div>

      <div style="font-size:0.8rem;color:#9ca3af;margin-bottom:6px;">识别的题目</div>
      <div class="question-box" id="result-question"></div>

      <!-- 题库匹配 -->
      <div id="matched-section" style="margin-bottom:16px;display:none">
        <div style="font-size:0.8rem;color:#9ca3af;margin-bottom:6px;">题库匹配</div>
        <div class="matched-box" id="matched-content"></div>
      </div>

      <!-- 思考过程折叠块 -->
      <div class="thinking-wrap" id="thinking-wrap" style="display:none">
        <div class="thinking-header" onclick="toggleThinking()">
          <span>🧠 模型思考过程</span>
          <span style="color:#b45309;font-size:0.75rem">（点击展开查看）</span>
          <span class="thinking-arrow" id="thinking-arrow">▼</span>
        </div>
        <div class="thinking-body" id="thinking-body"></div>
      </div>

      <div style="font-size:0.8rem;color:#9ca3af;margin-bottom:6px;">AI 解析</div>
      <div class="answer-box" id="result-answer"></div>

      <!-- 知识点 -->
      <div id="knowledge-section" style="margin-top:14px;display:none">
        <div style="font-size:0.8rem;color:#9ca3af;margin-bottom:6px;">涉及知识点</div>
        <div class="knowledge-tags" id="knowledge-tags"></div>
      </div>

      <!-- 程序题可视化 -->
      <div class="action-bar">
        <button class="btn btn-danger" id="mark-wrong-btn" onclick="markWrong()">❌ 加入错题本</button>
        <button class="btn btn-outline" onclick="clearAll()">🔄 重新搜题</button>
      </div>
    </div><!-- 结果卡片结束 -->

    <!-- 程序题可视化独立卡片，仅勾选且生成成功时出现 -->
    <div class="card" id="viz-section" style="display:none">
      <div class="card-title">🖥️ 程序可视化</div>
      <div style="font-size:0.8rem;color:#9ca3af;margin-bottom:10px;">
        以下为该程序题的交互式可视化演示
      </div>
      <iframe id="viz-frame" sandbox="allow-scripts"
        style="width:100%;height:480px;border:1.5px solid #e5e7eb;border-radius:10px;"></iframe>
    </div>

  </div><!-- result-section 结束 -->
<!--      <div class="viz-container" id="viz-section" style="display:none">-->
<!--        <div style="font-size:0.8rem;color:#9ca3af;margin-bottom:8px;">程序可视化</div>-->
<!--        <iframe id="viz-frame" sandbox="allow-scripts"></iframe>-->
<!--      </div>-->

      <div class="action-bar">
        <button class="btn btn-danger" id="mark-wrong-btn" onclick="markWrong()">❌ 加入错题本</button>
        <button class="btn btn-outline" onclick="clearAll()">🔄 重新搜题</button>
      </div>
    </div>
  </div>
</div>

<script>
let currentRecordId = null;
let selectedFile = null;

// 文件拖拽
const uploadArea = document.getElementById('upload-area');
uploadArea.addEventListener('dragover', function(e) { e.preventDefault(); uploadArea.classList.add('dragover'); });
uploadArea.addEventListener('dragleave', function() { uploadArea.classList.remove('dragover'); });
uploadArea.addEventListener('drop', function(e) {
  e.preventDefault();
  uploadArea.classList.remove('dragover');
  var file = e.dataTransfer.files[0];
  if (file) handleFileSelect(file);
});
document.getElementById('file-input').addEventListener('change', function(e) {
  if (e.target.files[0]) handleFileSelect(e.target.files[0]);
});

function handleFileSelect(file) {
  selectedFile = file;
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = document.getElementById('preview-img');
    img.src = e.target.result;
    img.style.display = 'block';
  };
  reader.readAsDataURL(file);
}

async function submitQuestion() {
  var textInput = document.getElementById('text-input').value.trim();
  var needViz = document.getElementById('need-viz').checked;

  if (!selectedFile && !textInput) {
    showError('请上传图片或输入题目内容');
    return;
  }

  hideError();
  showLoading('正在分析题目...');
  setSubmitDisabled(true);
  document.getElementById('result-section').style.display = 'none';

  try {
    var data;
    if (selectedFile) {
      document.getElementById('loading-text').textContent = '多模态模型识别中...';
      var formData = new FormData();
      formData.append('file', selectedFile);
      formData.append('username', 'default');
      formData.append('need_visualization', needViz);
      var resp = await fetch('/api/search/image', { method: 'POST', body: formData });
      data = await resp.json();
      if (!resp.ok) throw new Error(data.detail || '请求失败');
    } else {
      document.getElementById('loading-text').textContent = 'AI 解答中...';
      var resp2 = await fetch('/api/search/text', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question_text: textInput, username: 'default', need_visualization: needViz })
      });
      data = await resp2.json();
      if (!resp2.ok) throw new Error(data.detail || '请求失败');
    }
    showResult(data);
  } catch(e) {
    showError('搜题失败：' + e.message);
  } finally {
    hideLoading();
    setSubmitDisabled(false);
  }
}

function showResult(data) {
  currentRecordId = data.record_id;

  // Meta tags
  var tags = '';
  if (data.matched_from_bank) {
    tags += '<span class="tag tag-green">✅ 题库命中 ' + (data.similarity * 100).toFixed(0) + '%</span>';
  } else {
    tags += '<span class="tag tag-blue">🤖 AI 推理解答</span>';
  }
  if (data.matched_question) {
    var mq = data.matched_question;
    if (mq.subject) tags += '<span class="tag tag-purple">' + mq.subject + '</span>';
    if (mq.ques_type) tags += '<span class="tag tag-orange">' + mq.ques_type + '</span>';
    if (mq.ques_difficulty) tags += '<span class="tag tag-blue">' + mq.ques_difficulty + '</span>';
  }
  if (data.answered_by_vl) {
    tags += '<span class="tag tag-purple">📊 图表解析</span>';
  }
  document.getElementById('result-meta').innerHTML = tags;
  document.getElementById('result-meta').innerHTML = tags;

  document.getElementById('result-question').textContent = data.question_text;
  document.getElementById('result-answer').textContent = data.llm_answer;

  // 思考过程
  var thinkingWrap = document.getElementById('thinking-wrap');
  var thinkingBody = document.getElementById('thinking-body');
  if (data.llm_thinking && data.llm_thinking.trim()) {
    thinkingBody.textContent = data.llm_thinking;
    thinkingWrap.style.display = 'block';
    // 默认折叠
    thinkingBody.classList.remove('show');
    document.getElementById('thinking-arrow').classList.remove('open');
  } else {
    thinkingWrap.style.display = 'none';
  }

  // 题库匹配
  var matchedSec = document.getElementById('matched-section');
  if (data.matched_question && data.matched_from_bank) {
    var mq2 = data.matched_question;
    var answers = Array.isArray(mq2.ques_answer) ? mq2.ques_answer.join('、') : (mq2.ques_answer || '-');
    document.getElementById('matched-content').innerHTML =
      '<div class="label">📖 题库原题</div>' +
      '<div>' + (mq2.ques_content || '') + '</div>' +
      '<div style="margin-top:8px;font-size:0.8rem;">标准答案：' + answers + '</div>';
    matchedSec.style.display = 'block';
  } else {
    matchedSec.style.display = 'none';
  }

  // 知识点：优先用返回的 knowledges，其次用题库的
  var knowledges = data.knowledges || (data.matched_question && data.matched_question.ques_knowledges) || [];
  var knSec = document.getElementById('knowledge-section');
  if (knowledges.length > 0) {
    var knHtml = '';
    for (var i = 0; i < knowledges.length; i++) {
      knHtml += '<span class="knowledge-tag">' + knowledges[i] + '</span>';
    }
    document.getElementById('knowledge-tags').innerHTML = knHtml;
    knSec.style.display = 'block';
  } else {
    knSec.style.display = 'none';
  }

  // 程序题可视化

  // 程序题可视化（独立 box，文字解析仍然保留）
  var vizSec = document.getElementById('viz-section');
  if (data.visualization_html && data.visualization_html.trim().length > 50) {
    document.getElementById('viz-frame').srcdoc = data.visualization_html;
    vizSec.style.display = 'block';
  } else {
    vizSec.style.display = 'none';
  }

  document.getElementById('result-section').style.display = 'block';
  document.getElementById('mark-wrong-btn').disabled = false;
  document.getElementById('mark-wrong-btn').textContent = '❌ 加入错题本';
  // 游客第一次搜题后弹出登录引导
  if (isGuest() && !window._firstSearch) {
    window._firstSearch = true;
    setTimeout(function() { showModal('login'); }, 1500);
  }
}

function toggleThinking() {
  var body = document.getElementById('thinking-body');
  var arrow = document.getElementById('thinking-arrow');
  var isOpen = body.classList.contains('show');
  body.classList.toggle('show', !isOpen);
  arrow.classList.toggle('open', !isOpen);
}

async function markWrong() {
  if (!currentRecordId) return;
  var btn = document.getElementById('mark-wrong-btn');
  btn.disabled = true;
  btn.textContent = '✅ 已加入错题本';
  await fetch('/api/mark-wrong', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ record_id: currentRecordId, username: 'default' })
  });
}

function clearAll() {
  selectedFile = null;
  document.getElementById('file-input').value = '';
  document.getElementById('preview-img').style.display = 'none';
  document.getElementById('text-input').value = '';
  document.getElementById('result-section').style.display = 'none';
  hideError();
  currentRecordId = null;
}

function showLoading(text) {
  document.getElementById('loading-text').textContent = text || '处理中...';
  document.getElementById('loading').style.display = 'block';
}
function hideLoading() { document.getElementById('loading').style.display = 'none'; }
function showError(msg) {
  var el = document.getElementById('error-alert');
  el.textContent = msg; el.style.display = 'block';
}
function hideError() { document.getElementById('error-alert').style.display = 'none'; }
function setSubmitDisabled(v) { document.getElementById('submit-btn').disabled = v; }
</script>

<div class="modal-overlay" id="auth-modal" onclick="closeModalOutside(event)">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">x</button>
    <div class="modal-tabs">
      <button class="modal-tab active" id="tab-login" onclick="switchModalTab('login')">登录</button>
      <button class="modal-tab" id="tab-register" onclick="switchModalTab('register')">注册</button>
    </div>
    <div class="modal-form active" id="form-login">
      <div class="mf-alert mf-alert-err" id="login-err"></div>
      <div class="mf-alert mf-alert-ok" id="login-ok"></div>
      <div class="mf-group"><label>用户名</label><input type="text" id="m-username" placeholder="请输入用户名"></div>
      <div class="mf-group"><label>密码</label><input type="password" id="m-password" placeholder="请输入密码"></div>
      <button class="mf-submit" id="m-login-btn" onclick="doModalLogin()">登录</button>
      <button class="mf-guest" onclick="doModalGuest()">以游客身份继续</button>
    </div>
    <div class="modal-form" id="form-register">
      <div class="mf-alert mf-alert-err" id="reg-err"></div>
      <div class="mf-alert mf-alert-ok" id="reg-ok"></div>
      <div class="mf-group"><label>用户名</label><input type="text" id="m-reg-username" placeholder="2-20位字母数字或中文"></div>
      <div class="mf-group"><label>手机号</label>
        <div class="phone-row">
          <input type="tel" id="m-phone" placeholder="请输入手机号">
          <button class="sms-btn" id="m-sms-btn" onclick="modalSendSms()">获取验证码</button>
        </div>
      </div>
      <div class="mf-group"><label>验证码</label><input type="text" id="m-sms-code" placeholder="6位验证码" maxlength="6"></div>
      <div class="mf-group"><label>密码</label><input type="password" id="m-reg-password" placeholder="至少8位"></div>
      <div class="mf-group"><label>确认密码</label><input type="password" id="m-reg-password2" placeholder="再次输入密码"></div>
      <button class="mf-submit" id="m-reg-btn" onclick="doModalRegister()">注册</button>
      <button class="mf-guest" onclick="doModalGuest()">以游客身份继续</button>
    </div>
  </div>
</div>

<script>
function getToken(){return localStorage.getItem('token')||sessionStorage.getItem('token');}
function getUser(){var u=localStorage.getItem('user')||sessionStorage.getItem('user');try{return u?JSON.parse(u):null;}catch(e){return null;}}
function isGuest(){var u=getUser();return u&&u.role==='guest';}
function isLoggedIn(){return !!getToken()&&!!getUser();}

function updateNavUser(){
  var el=document.getElementById('nav-user');
  var user=getUser();
  if(!el)return;
  if(user&&user.role!=='guest'){
    el.innerHTML='<span class="nav-username">👤 '+user.username+'</span><button class="nav-logout" onclick="doLogout()">退出</button>';
  } else if(user&&user.role==='guest'){
    el.innerHTML='<span class="nav-username" style="color:rgba(255,255,255,0.6)">游客</span><button class="nav-btn nav-btn-outline" onclick="showModal(\'login\')">登录</button><button class="nav-btn nav-btn-primary" onclick="showModal(\'register\')">注册</button>';
  } else {
    el.innerHTML='<button class="nav-btn nav-btn-outline" onclick="showModal(\'login\')">登录</button><button class="nav-btn nav-btn-primary" onclick="showModal(\'register\')">注册</button>';
  }
}
function doLogout(){
  localStorage.removeItem('token');localStorage.removeItem('user');
  sessionStorage.removeItem('token');sessionStorage.removeItem('user');
  updateNavUser();
}
function showModal(tab){document.getElementById('auth-modal').classList.add('show');switchModalTab(tab||'login');}
function closeModal(){document.getElementById('auth-modal').classList.remove('show');}
function closeModalOutside(e){if(e.target===document.getElementById('auth-modal'))closeModal();}
function switchModalTab(tab){
  document.getElementById('form-login').classList.toggle('active',tab==='login');
  document.getElementById('form-register').classList.toggle('active',tab==='register');
  document.getElementById('tab-login').classList.toggle('active',tab==='login');
  document.getElementById('tab-register').classList.toggle('active',tab==='register');
}
function checkAndShowModal(){if(!isLoggedIn())showModal('login');}
function mfAlert(id,msg,type){
  var el=document.getElementById(id);if(!el)return;
  el.textContent=msg;el.className='mf-alert '+(type==='ok'?'mf-alert-ok':'mf-alert-err');el.style.display='block';
}
async function doModalLogin(){
  var u=document.getElementById('m-username').value.trim();
  var p=document.getElementById('m-password').value;
  if(!u||!p){mfAlert('login-err','请填写用户名和密码');return;}
  var btn=document.getElementById('m-login-btn');btn.disabled=true;btn.textContent='登录中...';
  try{
    var resp=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    var data=await resp.json();
    if(!resp.ok){mfAlert('login-err',data.detail||'登录失败');return;}
    localStorage.setItem('token',data.token);localStorage.setItem('user',JSON.stringify(data.user));
    mfAlert('login-ok','登录成功！','ok');
    setTimeout(function(){closeModal();updateNavUser();},800);
  }catch(e){mfAlert('login-err','网络错误，请重试');}
  finally{btn.disabled=false;btn.textContent='登录';}
}
var _smsTimer=null;
async function modalSendSms(){
  var phone=document.getElementById('m-phone').value.trim();
  if(!/^1[3-9][0-9]{9}$/.test(phone)){mfAlert('reg-err','请输入正确的手机号');return;}
  var btn=document.getElementById('m-sms-btn');btn.disabled=true;
  try{
    var resp=await fetch('/api/auth/send-sms?phone='+phone,{method:'POST'});
    var data=await resp.json();
    if(!resp.ok){mfAlert('reg-err',data.detail||'发送失败');btn.disabled=false;return;}
    mfAlert('reg-ok','验证码已发送（开发模式：'+(data.dev_code||'见日志')+'）','ok');
    var count=60;
    _smsTimer=setInterval(function(){btn.textContent=count+'s';count--;if(count<0){clearInterval(_smsTimer);btn.disabled=false;btn.textContent='获取验证码';}},1000);
  }catch(e){mfAlert('reg-err','网络错误');btn.disabled=false;}
}
async function doModalRegister(){
  var u=document.getElementById('m-reg-username').value.trim();
  var ph=document.getElementById('m-phone').value.trim();
  var sc=document.getElementById('m-sms-code').value.trim();
  var pw=document.getElementById('m-reg-password').value;
  var pw2=document.getElementById('m-reg-password2').value;
  if(!u||u.length<2){mfAlert('reg-err','用户名至少2位');return;}
  if(!/^1[3-9][0-9]{9}$/.test(ph)){mfAlert('reg-err','请输入正确的手机号');return;}
  if(!sc||sc.length!==6){mfAlert('reg-err','请输入6位验证码');return;}
  if(pw.length<8){mfAlert('reg-err','密码至少8位');return;}
  if(pw!==pw2){mfAlert('reg-err','两次密码不一致');return;}
  var btn=document.getElementById('m-reg-btn');btn.disabled=true;btn.textContent='注册中...';
  try{
    var resp=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:pw,phone:ph,sms_code:sc})});
    var data=await resp.json();
    if(!resp.ok){mfAlert('reg-err',data.detail||'注册失败');return;}
    localStorage.setItem('token',data.token);localStorage.setItem('user',JSON.stringify(data.user));
    mfAlert('reg-ok','注册成功！','ok');
    setTimeout(function(){closeModal();updateNavUser();},800);
  }catch(e){mfAlert('reg-err','网络错误，请重试');}
  finally{btn.disabled=false;btn.textContent='注册';}
}
async function doModalGuest(){
  try{
    var resp=await fetch('/api/auth/guest',{method:'POST'});
    var data=await resp.json();
    sessionStorage.setItem('token',data.token);sessionStorage.setItem('user',JSON.stringify(data.user));
    closeModal();updateNavUser();
  }catch(e){alert('网络错误，请重试');}
}
updateNavUser();
setTimeout(checkAndShowModal,500);
</script>

</body>
</html>
