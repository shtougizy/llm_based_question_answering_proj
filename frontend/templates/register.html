<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 - 拍照搜题系统</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "PingFang SC","Microsoft YaHei",sans-serif; background: linear-gradient(135deg,#667eea 0%,#764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.card { background: #fff; border-radius: 20px; padding: 40px 36px; width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
.logo { text-align: center; margin-bottom: 28px; }
.logo h1 { font-size: 1.3rem; font-weight: 700; color: #374151; margin-top: 8px; }
.form-group { margin-bottom: 14px; }
.form-group label { font-size: 0.82rem; color: #6b7280; font-weight: 500; display: block; margin-bottom: 6px; }
.form-group input { width: 100%; border: 1.5px solid #e5e7eb; border-radius: 10px; padding: 11px 14px; font-size: 0.9rem; outline: none; transition: border-color 0.2s; }
.form-group input:focus { border-color: #667eea; }
.phone-row { display: flex; gap: 8px; }
.phone-row input { flex: 1; }
.sms-btn { padding: 11px 14px; border: 1.5px solid #667eea; border-radius: 10px; background: transparent; color: #667eea; font-size: 0.82rem; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
.sms-btn:hover { background: #667eea; color: #fff; }
.sms-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn { width: 100%; padding: 13px; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-top: 6px; }
.btn-primary { background: linear-gradient(135deg,#667eea,#764ba2); color: #fff; box-shadow: 0 4px 12px rgba(102,126,234,0.35); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
.footer-link { text-align: center; margin-top: 18px; font-size: 0.85rem; color: #6b7280; }
.footer-link a { color: #667eea; text-decoration: none; font-weight: 500; }
.alert { padding: 10px 14px; border-radius: 8px; font-size: 0.82rem; margin-bottom: 14px; display: none; }
.alert-error { background: #fef2f2; color: #dc2626; border: 1px solid #fca5a5; }
.alert-success { background: #f0fdf4; color: #059669; border: 1px solid #86efac; }
.hint { font-size: 0.75rem; color: #9ca3af; margin-top: 4px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div style="font-size:2.2rem">📚</div>
    <h1>创建账号</h1>
  </div>
  <div class="alert alert-error" id="err-msg"></div>
  <div class="alert alert-success" id="ok-msg"></div>
  <div class="form-group">
    <label>用户名</label>
    <input type="text" id="username" placeholder="4-20位字母、数字或中文">
    <div class="hint">用户名注册后不可修改</div>
  </div>
  <div class="form-group">
    <label>手机号</label>
    <div class="phone-row">
      <input type="tel" id="phone" placeholder="请输入手机号">
      <button class="sms-btn" id="sms-btn" onclick="sendSms()">获取验证码</button>
    </div>
  </div>
  <div class="form-group">
    <label>短信验证码</label>
    <input type="text" id="sms-code" placeholder="请输入6位验证码" maxlength="6">
  </div>
  <div class="form-group">
    <label>密码</label>
    <input type="password" id="password" placeholder="至少8位，包含字母和数字">
  </div>
  <div class="form-group">
    <label>确认密码</label>
    <input type="password" id="password2" placeholder="再次输入密码">
  </div>
  <button class="btn btn-primary" id="reg-btn" onclick="doRegister()">注册</button>
  <div class="footer-link">已有账号？<a href="/login">立即登录</a></div>
</div>

<script>
var smsTimer = null;

function showErr(msg) {
  var e = document.getElementById("err-msg");
  e.textContent = msg; e.style.display = "block";
  document.getElementById("ok-msg").style.display = "none";
}
function showOk(msg) {
  var e = document.getElementById("ok-msg");
  e.textContent = msg; e.style.display = "block";
  document.getElementById("err-msg").style.display = "none";
}

async function sendSms() {
  var phone = document.getElementById("phone").value.trim();
  if (!/^1[3-9]\d{9}$/.test(phone)) { showErr("请输入正确的手机号"); return; }
  var btn = document.getElementById("sms-btn");
  btn.disabled = true;
  try {
    var resp = await fetch("/api/auth/send-sms?phone=" + phone, {method: "POST"});
    var data = await resp.json();
    if (!resp.ok) { showErr(data.detail || "发送失败"); btn.disabled = false; return; }
    showOk("验证码已发送（开发模式：" + (data.dev_code || "见日志") + "）");
    // 60秒倒计时
    var count = 60;
    smsTimer = setInterval(function() {
      btn.textContent = count + "s后重发";
      count--;
      if (count < 0) {
        clearInterval(smsTimer);
        btn.disabled = false;
        btn.textContent = "获取验证码";
      }
    }, 1000);
  } catch(e) {
    showErr("网络错误"); btn.disabled = false;
  }
}

async function doRegister() {
  var username = document.getElementById("username").value.trim();
  var phone    = document.getElementById("phone").value.trim();
  var smsCode  = document.getElementById("sms-code").value.trim();
  var password = document.getElementById("password").value;
  var password2= document.getElementById("password2").value;

  if (!username) { showErr("请填写用户名"); return; }
  if (username.length < 2 || username.length > 20) { showErr("用户名长度2-20位"); return; }
  if (!/^1[3-9]\d{9}$/.test(phone)) { showErr("请输入正确的手机号"); return; }
  if (!smsCode || smsCode.length !== 6) { showErr("请输入6位验证码"); return; }
  if (password.length < 8) { showErr("密码至少8位"); return; }
  if (password !== password2) { showErr("两次密码不一致"); return; }

  var btn = document.getElementById("reg-btn");
  btn.disabled = true; btn.textContent = "注册中...";
  try {
    var resp = await fetch("/api/auth/register", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({username, password, phone, sms_code: smsCode})
    });
    var data = await resp.json();
    if (!resp.ok) { showErr(data.detail || "注册失败"); return; }
    localStorage.setItem("token", data.token);
    localStorage.setItem("user", JSON.stringify(data.user));
    showOk("注册成功！跳转中...");
    setTimeout(function() { window.location.href = "/"; }, 1000);
  } catch(e) {
    showErr("网络错误，请重试");
  } finally {
    btn.disabled = false; btn.textContent = "注册";
  }
}
</script>
</body>
</html>
